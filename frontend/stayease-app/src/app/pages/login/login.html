<!-- Page wrapper -->
<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md">

    <!-- Card -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8">

      <!-- Logo / heading -->
      <div class="text-center mb-8">
        <a routerLink="/" class="inline-flex items-center gap-2 mb-4">
          <svg class="w-8 h-8 text-rose-500" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/>
          </svg>
          <span class="text-2xl font-bold text-gray-900">Stay<span class="text-rose-500">Ease</span></span>
        </a>
        <h1 class="text-xl font-bold text-gray-900">Welcome back</h1>
        <p class="text-sm text-gray-500 mt-1">Sign in to your account to continue</p>
      </div>

      <!-- Error alert -->
      @if (errorMessage()) {
        <div class="mb-5 flex items-start gap-3 bg-red-50 border border-red-100 text-red-700 text-sm rounded-xl px-4 py-3">
          <svg class="w-5 h-5 mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- Email -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">
            Email <span class="text-rose-500">*</span>
          </label>
          <input
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email"
            class="w-full border rounded-xl px-4 py-2.5 text-sm text-gray-800 placeholder-gray-300 outline-none transition-colors"
            [class.border-gray-200]="!loginForm.get('email')?.touched || !loginForm.get('email')?.invalid"
            [class.border-red-400]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
            [class.bg-red-50]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"/>
          @if (emailErrors) {
            <p class="mt-1.5 text-xs text-red-500">{{ emailErrors }}</p>
          }
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">
            Password <span class="text-rose-500">*</span>
          </label>
          <div class="relative">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="current-password"
              class="w-full border rounded-xl px-4 py-2.5 pr-11 text-sm text-gray-800 placeholder-gray-300 outline-none transition-colors"
              [class.border-gray-200]="!loginForm.get('password')?.touched || !loginForm.get('password')?.invalid"
              [class.border-red-400]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
              [class.bg-red-50]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"/>
            <button
              type="button"
              (click)="showPassword.set(!showPassword())"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600 transition-colors"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
              @if (showPassword()) {
                <!-- Eye-off icon -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-5 0-9-4-9-7 0-1.24.54-2.39 1.41-3.36M6.53 6.53A9.97 9.97 0 0112 5c5 0 9 4 9 7 0 1.24-.54 2.39-1.41 3.36M9.88 9.88A3 3 0 0114.12 14.12M3 3l18 18"/>
                </svg>
              } @else {
                <!-- Eye icon -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              }
            </button>
          </div>
          @if (passwordErrors) {
            <p class="mt-1.5 text-xs text-red-500">{{ passwordErrors }}</p>
          }
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="isLoading()"
          class="w-full bg-rose-500 hover:bg-rose-600 disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition-colors text-sm flex items-center justify-center gap-2">
          @if (isLoading()) {
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            Signing in...
          } @else {
            Sign In
          }
        </button>

      </form>

      <!-- Footer link -->
      <p class="text-center text-sm text-gray-500 mt-6">
        Don't have an account?
        <a routerLink="/register" class="text-rose-500 font-semibold hover:text-rose-600 transition-colors">Create one</a>
      </p>

    </div>
  </div>
</div>
