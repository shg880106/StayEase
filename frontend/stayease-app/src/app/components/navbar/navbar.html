<nav class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <a routerLink="/" class="flex items-center gap-2">
        <svg class="w-7 h-7 text-rose-500" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/>
        </svg>
        <span class="text-xl font-bold text-gray-900">Stay<span class="text-rose-500">Ease</span></span>
      </a>

      <div class="flex items-center gap-8">
        <a routerLink="/"
           routerLinkActive="text-rose-500 font-semibold"
           [routerLinkActiveOptions]="{ exact: true }"
           class="text-gray-600 hover:text-rose-500 transition-colors text-sm font-medium">
          Home
        </a>
        <a routerLink="/booking"
           routerLinkActive="text-rose-500 font-semibold"
           class="text-gray-600 hover:text-rose-500 transition-colors text-sm font-medium">
          Booking
        </a>

        @if (authService.isLoggedIn()) {
          <!-- Logged-in user: dropdown trigger -->
          <div class="relative" id="user-menu-trigger">
            <button
              (click)="toggleDropdown()"
              class="flex items-center gap-2 border border-gray-200 rounded-full pl-3 pr-2 py-1.5 text-sm text-gray-700 font-medium hover:border-rose-300 hover:text-rose-500 transition-colors select-none">
              <!-- Avatar initials -->
              <span class="w-6 h-6 rounded-full bg-rose-100 text-rose-500 text-xs font-bold flex items-center justify-center shrink-0">
                {{ authService.currentUser()!.name.charAt(0).toUpperCase() }}
              </span>
              {{ authService.currentUser()!.name }}
              <!-- Chevron -->
              <svg
                class="w-4 h-4 text-gray-400 transition-transform duration-200"
                [class.rotate-180]="dropdownOpen()"
                fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>

            <!-- Dropdown panel -->
            @if (dropdownOpen()) {
              <div class="absolute right-0 mt-2 min-w-48 w-max max-w-xs bg-white border border-gray-100 rounded-2xl shadow-lg py-1 z-50">

                <!-- User info header -->
                <div class="px-4 py-2.5 border-b border-gray-100">
                  <p class="text-xs font-semibold text-gray-900 truncate">{{ authService.currentUser()!.name }}</p>
                  <p class="text-xs text-gray-400">{{ authService.currentUser()!.email }}</p>
                </div>

                <!-- Properties -->
                <a
                  routerLink="/my-properties"
                  (click)="closeDropdown()"
                  class="flex items-center gap-2.5 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 hover:text-rose-500 transition-colors">
                  <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                  </svg>
                  My Properties
                </a>

                <!-- Divider -->
                <div class="border-t border-gray-100 my-1"></div>

                <!-- Sign Out -->
                <button
                  (click)="authService.logout(); closeDropdown()"
                  class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-gray-700 hover:bg-red-50 hover:text-red-500 transition-colors">
                  <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
                  </svg>
                  Sign Out
                </button>

              </div>
            }
          </div>
        } @else {
          <!-- Guest -->
          <div class="flex items-center gap-2">
            <a routerLink="/login"
               class="text-sm text-gray-600 hover:text-rose-500 font-medium transition-colors px-3 py-1.5 rounded-full hover:bg-gray-50">
              Sign In
            </a>
            <a routerLink="/register"
               class="flex items-center gap-1.5 bg-rose-500 hover:bg-rose-600 text-white text-sm font-semibold px-4 py-1.5 rounded-full transition-colors">
              Register
            </a>
          </div>
        }
      </div>

    </div>
  </div>
</nav>
