trigger:
- main

pool:
  name: Default  # self-hosted agent pool name

steps:
- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: '8.0.x'
  displayName: 'Use .NET SDK'

- script: dotnet build --configuration Release
  displayName: 'Build'
  workingDirectory: backend/tests/StayEaseApp.E2ETests
- task: PowerShell@2
  displayName: 'Install Playwright Browsers'
  inputs:
    targetType: inline
    script: ./bin/Release/net8.0/playwright.ps1 install --with-deps
    workingDirectory: backend/tests/StayEaseApp.E2ETests
- script: dotnet test -s ./.runsettings --configuration Release
  displayName: 'Run Tests'
  workingDirectory: backend/tests/StayEaseApp.E2ETests
  env:
    TEST_BASEURL: $(TEST_BASEURL)
    TEST_APIURL: $(TEST_APIURL)