name: E2E-Tests

resources:
  pipelines:
  - pipeline: buildPipelineE2E
    source: 'StayEase (backend)'
    trigger:
      branches:
        include:
        - main

trigger: none

pool:
  name: Default  # self-hosted agent pool name

steps:
- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: '8.0.x'
  displayName: 'Use .NET SDK'

- script: dotnet build --configuration Release
  displayName: 'Build'
  workingDirectory: backend/tests/StayEaseApp.E2ETests

- task: PublishPipelineArtifact@1
  displayName: 'Publish E2E test binaries'
  inputs:
    targetPath: 'backend/tests/StayEaseApp.E2ETests/bin/Release/net8.0'
    artifact: 'e2e-test-binaries'

- task: PowerShell@2
  displayName: 'Install Playwright Browsers'
  inputs:
    targetType: inline
    script: ./bin/Release/net8.0/playwright.ps1 install --with-deps
    workingDirectory: backend/tests/StayEaseApp.E2ETests

- task: DotNetCoreCLI@2
  displayName: 'Run Tests'
  inputs:
    command: 'test'
    projects: 'backend/tests/StayEaseApp.E2ETests/StayEaseApp.E2ETests.csproj'
    arguments: '-s ./.runsettings --configuration Release --no-build'
    publishTestResults: true
    testRunTitle: 'StayEase E2E Tests'
    workingDirectory: 'backend/tests/StayEaseApp.E2ETests'
  env:
    TEST_BASEURL: $(TEST_BASEURL)
    TEST_APIURL: $(TEST_APIURL)
